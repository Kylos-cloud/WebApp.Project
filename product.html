<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOP — Бараа</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── PAGE LAYOUT ── */
    .product-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 40px 100px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: hsl(0, 0%, 50%);
      text-decoration: none;
      margin-bottom: 36px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--color-text);
    }

    /* ── MAIN GRID ── */
    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }

    /* ── IMAGE SIDE ── */
    .product-images {
      position: sticky;
      top: 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: var(--color-bg1);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }

    .main-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .main-image-wrap:hover img {
      transform: scale(1.04);
    }

    /* Thumbnail strip */
    .thumb-strip {
      display: flex;
      gap: 10px;
    }

    .thumb {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      transition: border-color 0.2s, transform 0.15s;
    }

    .thumb:hover {
      transform: translateY(-2px);
    }

    .thumb.active {
      border-color: var(--color-text);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-tag-detail {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .tag-sale {
      background: red;
      color: white;
    }

    .tag-new {
      background: #222;
      color: white;
    }

    .out-of-stock-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: hsl(0, 0%, 40%);
      letter-spacing: 2px;
    }

    /* ── INFO SIDE ── */
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .product-brand-link {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: hsl(0, 0%, 50%);
      text-decoration: none;
      transition: color 0.2s;
    }

    .product-brand-link:hover {
      color: var(--color-text);
    }

    .product-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0;
    }

    /* Stars */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stars {
      display: flex;
      gap: 2px;
    }

    .star {
      font-size: 16px;
      color: hsl(0, 0%, 80%);
    }

    .star.filled {
      color: #f5a623;
    }

    .star.half {
      color: #f5a623;
      opacity: 0.6;
    }

    .rating-num {
      font-size: 14px;
      font-weight: 600;
    }

    .rating-count {
      font-size: 13px;
      color: hsl(0, 0%, 55%);
    }

    /* Price */
    .price-block {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .price-new {
      font-size: 32px;
      font-weight: 700;
      color: red;
    }

    .price-old {
      font-size: 18px;
      text-decoration: line-through;
      color: hsl(0, 0%, 60%);
    }

    .price-discount {
      background: hsl(0, 80%, 95%);
      color: red;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .divider {
      height: 1px;
      background: var(--color-border);
    }

    .product-description {
      font-size: 14px;
      line-height: 1.7;
      color: hsl(0, 0%, 40%);
    }

    /* Qty */
    .qty-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: hsl(0, 0%, 50%);
      margin-bottom: 10px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--color-border);
      border-radius: 30px;
      overflow: hidden;
    }

    .qty-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      color: var(--color-text);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: var(--color-bg1);
    }

    .qty-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .qty-num {
      font-size: 16px;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .qty-stock {
      font-size: 13px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .qty-stock.stock-high {
      color: #1a7a3a;
      background: #e6f9ed;
    }
    .qty-stock.stock-low {
      color: #a05000;
      background: #fff3e0;
    }
    .qty-stock.stock-out {
      color: #b71c1c;
      background: #fdecea;
    }

    /* Action buttons */
    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-cart {
      width: 100%;
      padding: 15px;
      background: var(--color-text);
      color: var(--color-white);
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-cart:hover {
      opacity: 0.82;
      transform: translateY(-1px);
    }

    .btn-cart:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-cart.added {
      background: hsl(140, 50%, 38%);
    }

    .btn-wishlist {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--color-text);
      border: 1.5px solid var(--color-border);
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-wishlist:hover {
      border-color: red;
      color: red;
    }

    .btn-wishlist.saved {
      border-color: red;
      color: red;
      background: hsl(0, 80%, 97%);
    }

    /* Meta */
    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }

    .meta-key {
      color: hsl(0, 0%, 55%);
      min-width: 90px;
      flex-shrink: 0;
    }

    .meta-val {
      font-weight: 500;
      color: var(--color-text);
    }

    /* ══════════════════════════════════════════
       DETAILED INFO SECTION (Screenshot 2)
    ══════════════════════════════════════════ */
    .detail-section {
      margin-top: 60px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
      align-items: start;
    }

    /* Left card — detailed info */
    .detail-card {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: 32px;
    }

    .detail-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .detail-item {
      background: var(--color-bg);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .detail-item strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--color-text);
    }

    .detail-item p {
      font-size: 12.5px;
      line-height: 1.55;
      color: hsl(0, 0%, 45%);
      margin: 0;
    }

    .detail-bullets {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
    }

    .detail-bullet {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13.5px;
      color: hsl(0, 0%, 30%);
      line-height: 1.5;
    }

    .detail-bullet .check {
      color: hsl(140, 55%, 38%);
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Right card — brand comparison */
    .brand-card {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: 28px;
    }

    .brand-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .brand-card .brand-subtitle {
      font-size: 12.5px;
      color: hsl(0, 0%, 55%);
      margin-bottom: 20px;
    }

    .brand-table {
      width: 100%;
      border-collapse: collapse;
    }

    .brand-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: hsl(0, 0%, 55%);
      padding: 0 0 10px;
      border-bottom: 1px solid var(--color-border);
    }

    .brand-table td {
      padding: 14px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: middle;
    }

    .brand-table tr:last-child td {
      border-bottom: none;
    }

    .brand-name-cell {
      font-weight: 700;
    }

    .brand-badge {
      display: inline-block;
      margin-top: 4px;
      background: red;
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }

    .brand-price-cell {
      font-weight: 700;
      color: red;
    }

    .brand-cur-cell {
      font-size: 11px;
      color: hsl(0, 0%, 55%);
      text-align: right;
    }

    /* ══════════════════════════════════════════
       REVIEWS SECTION (Screenshot 3)
    ══════════════════════════════════════════ */
    .reviews-section {
      margin-top: 40px;
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: 36px;
    }

    .reviews-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .reviews-header-left h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .reviews-header-left p {
      font-size: 13px;
      color: hsl(0, 0%, 55%);
    }

    .reviews-header-right {
      text-align: right;
    }

    .reviews-big-score {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }

    .reviews-big-stars {
      display: flex;
      gap: 3px;
      justify-content: flex-end;
      margin: 4px 0;
    }

    .reviews-big-stars .star {
      font-size: 20px;
    }

    .reviews-count-label {
      font-size: 12px;
      color: hsl(0, 0%, 55%);
    }

    /* Individual review cards */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .review-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .review-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .reviewer-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .review-date {
      font-size: 12px;
      color: hsl(0, 0%, 55%);
    }

    .review-body {
      font-size: 13.5px;
      color: hsl(0, 0%, 30%);
      line-height: 1.6;
      margin: 0;
    }

    /* Review form */
    .review-divider {
      height: 1px;
      background: var(--color-border);
      margin-bottom: 24px;
    }

    .review-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr auto;
      gap: 12px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: hsl(0, 0%, 45%);
    }

    .form-input,
    .form-select,
    .form-textarea {
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--color-text);
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--color-text);
    }

    .form-textarea {
      resize: vertical;
      min-height: 44px;
    }

    .btn-submit {
      padding: 11px 22px;
      background: var(--color-text);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-submit:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    /* Related */
    .related-section {
      margin-top: 60px;
    }

    .related-section h2 {
      margin-bottom: 24px;
      font-size: 20px;
      font-weight: 700;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--color-text);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Not found */
    .not-found {
      text-align: center;
      padding: 120px 20px;
      color: hsl(0, 0%, 55%);
    }

    .not-found h2 {
      margin-bottom: 12px;
    }

    .not-found a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      border: 2px solid var(--color-text);
      border-radius: 30px;
      text-decoration: none;
      color: var(--color-text);
      font-size: 14px;
      transition: 0.2s;
    }

    .not-found a:hover {
      background: var(--color-text);
      color: white;
    }

    @media (max-width: 900px) {
      .detail-section {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .product-page {
        padding: 20px 16px 100px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .product-images {
        position: static;
      }

      .product-title {
        font-size: 22px;
      }

      .price-new {
        font-size: 26px;
      }

      .review-form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .review-form-grid .form-group:nth-child(3) {
        grid-column: 1 / -1;
      }

      .btn-submit {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      .related-section .products {
        display: flex !important;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap: 12px;
        padding-bottom: 12px;
      }

      .related-section .products::-webkit-scrollbar {
        display: none;
      }

      .related-section .products article {
        flex: 0 0 160px;
        min-width: 160px;
      }
    }
  </style>
</head>

      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-width="2"
          d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
      <span>Профайл</span>
    </a>
  </nav>

  <script src="js/categoryMenu.js"></script>
  <script src="js/script.js"></script>
  <script type="module" src="js/searchAll.js"></script>
  <script type="module" src="js/badges.js"></script>
  <script type="module">
    import { getMe, addToCart as storeAddToCart, isInCart, addToSaved, removeFromSaved, isInSaved, API_BASE } from "./js/store.js";

    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get("id"));
    const page = document.getElementById("productPage");

    const catLabels = {
      "huvtsas": "Хувцас, Гутал",
      "tsakhilgaan": "Цахилгаан бараа",
      "goo-saikhan": "Гоо сайхан",
      "ger-ahui": "Гэр ахуй",
      "ayalal": "Аялал",
      "eruul": "Эрүүл мэнд",
      "togloom": "Тоглоом",
      "bichig": "Бичиг хэрэг",
      "tejeewr": "Тэжээвэр амьтан",
      "shine-huns": "Шинэ хүнс",
      "bolovsruulsan-huns": "Боловсруулсан хүнс",
      "shingen-huns": "Шингэн хүнс",
    };

    const descriptions = {
      "huvtsas": "Өндөр чанарын материалаар хийгдсэн, таны хэв маягийг илэрхийлэх гоёмсог загвар. Урт эдэлгээтэй, тав тухтай.",
      "tsakhilgaan": "Хамгийн сүүлийн үеийн технологиор хийгдсэн бөгөөд таны өдөр тутмын амьдралыг хялбарчлах ухаалаг гаджет.",
      "goo-saikhan": "Мэргэжлийн гоо сайхны мэргэжилтнүүдэд хүртэл таалагддаг, арьс болон гоо сайханд зориулсан тусгай бүтээгдэхүүн.",
      "ger-ahui": "Таны гэрийг илүү затай, тухтай болгох өндөр чанарын гэр ахуйн бараа. Удаан эдэлгээтэй, практик загвар.",
      "ayalal": "Аялал жуулчлалын туршлагатай хүмүүсийн сонголт. Хөнгөн, бат бэх, авсаархан загвар.",
      "eruul": "Эрүүл мэнд, чийрэг байдлыг дэмжих мэргэжлийн бүтээгдэхүүн. Эмч нарын зөвлөмжид тулгуурлан бүтээгдсэн.",
      "togloom": "Бүх насны хүмүүст тохирох чанарлаг тоглоом болон хобби хэрэгсэл. Баяр баясгалан, суралцах боломжийг нэгтгэсэн.",
      "bichig": "Оффис болон сургуульд зориулсан өндөр чанарын бичиг хэрэгсэл. Бичих дуртай хүн бүрт тохиромжтой.",
      "tejeewr": "Таны үнэт тэжээвэр амьтдад зориулсан эрүүл, чанарлаг хоол болон хэрэгсэл.",
    };

    // Detail feature blocks per category
    const detailFeatures = {
      "goo-saikhan": [
        { title: "Арьсанд мэдрэмжтэй", body: "Өдөр тутмын арчилгаанд зөөлөн, таатай мэдрэмж өгөхөөр сонгосон." },
        { title: "Үнэр ба бүтэц", body: "Брэндийн онцлог үнэр, мэдрэмжийг хадгалсан premium сонголт." },
        { title: "Хэрэглэх зөвлөмж", body: "Цэвэр арьсанд бага хэмжээгээр хэрэглэж, тогтмол хэрэглэлээг эрхэмлээрэй." },
        { title: "Бэлгийн сонголт", body: "Савлагаа болон брэндийн үнэлэмж нь бэлэглэхэд тохиромжтой." },
      ],
      "huvtsas": [
        { title: "Материал", body: "100% байгалийн тос агуулсан, арьсанд зөөлөн даавуу ашигласан." },
        { title: "Загвар", body: "Орчин үеийн хэв маягт нийцсэн, тав тухтай зүсэлт." },
        { title: "Угаах заавар", body: "30°C-д угаах машинаар угаана. Нарнаас хамгаалж хатаах." },
        { title: "Хэмжээ", body: "XS-ээс XXL хүртэлх хэмжээнд байна. Хэмжих хүснэгтийг харна уу." },
      ],
    };

    // Brand comparison data per category
    const brandCompare = {
      "goo-saikhan": [
        { brand: "Loewe", product: "Loewe liquid soap", price: 60000, current: true },
        { brand: "Aesop", product: "Aesop Resurrection Hand Balm", price: 92000 },
      ],
      "huvtsas": [
        { brand: "Zara", product: "Zara Classic Shirt", price: 45000, current: true },
        { brand: "H&M", product: "H&M Slim Fit Tee", price: 28000 },
      ],
    };

    const sampleReviews = [
      { name: "Ариун", stars: 5, date: "2026-05-01", body: "Үнэ болон чанарын хувьд дажгүй санагдсан. Мэдээлэл нь ойлгомжтой байсан болохоор сонгоход амар байлаа." },
      { name: "Тэмүүлэн", stars: 4, date: "2026-05-06", body: "Хүргэлт хурдан, савлагаа цэвэрхэн ирсэн. Дахиад энэ брэндээс сонгож магадгүй." },
    ];

    function formatPrice(n) { return n.toLocaleString("mn-MN") + "₮"; }

    function renderStars(rating, size = 16) {
      let html = "";
      for (let i = 1; i <= 5; i++) {
        if (rating >= i) html += `<span class="star filled" style="font-size:${size}px">★</span>`;
        else if (rating >= i - 0.5) html += `<span class="star half"   style="font-size:${size}px">★</span>`;
        else html += `<span class="star"         style="font-size:${size}px">★</span>`;
      }
      return html;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    /* ── Build the reviews section HTML ── */
    function buildReviews(product, reviews) {
      const avg = reviews.length
        ? (reviews.reduce((s, r) => s + r.stars, 0) / reviews.length).toFixed(1)
        : product.rating;

      const reviewCards = reviews.map(r => `
        <div class="review-card">
          <div class="review-card-top">
            <div>
              <div class="reviewer-name">${r.name}</div>
              <div class="stars">${renderStars(r.stars, 14)}</div>
            </div>
            <div class="review-date">${r.date}</div>
          </div>
          <p class="review-body">${r.body}</p>
        </div>
      `).join("");

      return `
        <section class="reviews-section">
          <div class="reviews-header">
            <div class="reviews-header-left">
              <h2>Сэтгэгдэл</h2>
              <p>Худалдан авагчдын үнэлгээ болон туршлага</p>
            </div>
            <div class="reviews-header-right">
              <div class="reviews-big-score">${avg}</div>
              <div class="reviews-big-stars">${renderStars(parseFloat(avg), 20)}</div>
              <div class="reviews-count-label">${reviews.length} сэтгэгдэл</div>
            </div>
          </div>

          <div class="review-list" id="reviewList">
            ${reviewCards}
          </div>

          <div class="review-divider"></div>

          <!-- Add review form -->
          <div class="review-form-grid">
            <div class="form-group">
              <label class="form-label">Нэр</label>
              <input class="form-input" id="rvName" type="text" placeholder="Таны нэр" />
            </div>
            <div class="form-group">
              <label class="form-label">Үнэлгээ</label>
              <select class="form-select" id="rvStars">
                <option value="5">5 од</option>
                <option value="4">4 од</option>
                <option value="3">3 од</option>
                <option value="2">2 од</option>
                <option value="1">1 од</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Сэтгэгдэл</label>
              <textarea class="form-textarea" id="rvText" placeholder="Энэ барааны талаар..."></textarea>
            </div>
            <button class="btn-submit" onclick="submitReview()">Илгээх</button>
          </div>
        </section>
      `;
    }

    /* ── Build detailed info + brand comparison section ── */
    function buildDetailSection(product) {
      const features = detailFeatures[product.category] || [
        { title: "Чанар", body: "Өндөр чанарын материал ашигласан, удаан эдэлгээтэй." },
        { title: "Загвар", body: "Орчин үеийн хэв маягт нийцсэн гоёмсог дизайн." },
        { title: "Зориулалт", body: "Өдөр тутмын хэрэглээнд тохиромжтой." },
        { title: "Баталгаа", body: "6 сарын үйлдвэрийн баталгаатай." },
      ];

      const featureGrid = features.map(f => `
        <div class="detail-item">
          <strong>${f.title}</strong>
          <p>${f.body}</p>
        </div>
      `).join("");

      const brands = brandCompare[product.category] || [];
      const catLabel = catLabels[product.category] || product.category;

      const brandRows = brands.map(b => `
        <tr>
          <td class="brand-name-cell">
            ${b.brand}
            ${b.current ? '<br><span class="brand-badge">Одоо</span>' : ''}
          </td>
          <td>${b.product}</td>
          <td class="brand-price-cell">${formatPrice(b.price)}</td>
          <td class="brand-cur-cell">-</td>
        </tr>
      `).join("");

      const brandSection = brands.length ? `
        <div class="brand-card">
          <h3>Брэнд харьцуулалт</h3>
          <p class="brand-subtitle">Ижил төрөл: ${catLabel}</p>
          <table class="brand-table">
            <thead>
              <tr>
                <th>Брэнд</th>
                <th>Бараа</th>
                <th>Үнэ</th>
                <th>Үн</th>
              </tr>
            </thead>
            <tbody>${brandRows}</tbody>
          </table>
        </div>
      ` : "";

      return `
        <section class="detail-section">
          <div class="detail-card">
            <h2>Дэлгэрэнгүй мэдээлэл</h2>
            <div class="detail-grid">${featureGrid}</div>
            <div class="detail-bullets">
              <div class="detail-bullet"><span class="check">✓</span><span>Үнэлгээ өндөртэй ижил төрлийн бараатай шууд харьцуулж болно.</span></div>
              <div class="detail-bullet"><span class="check">✓</span><span>Арьс арчилгаа, үнэртэн, гоо сайхны routine-д нэмэхэд хялбар.</span></div>
              <div class="detail-bullet"><span class="check">✓</span><span>Хэрэглэгч худалдан авахаас өмнэ үнэ, брэнд, үнэлгээний ялгааг харах боломжтой.</span></div>
            </div>
          </div>
          ${brandSection}
        </section>
      `;
    }

    async function init() {
      if (!productId) { renderNotFound(); return; }

      const res = await fetch(`${API_BASE}/products/all`);
      const data = await res.json();
      const product = data.products.find(p => p.id === productId);
      if (!product) { renderNotFound(); return; }

      const related = data.products
        .filter(p => p.category === product.category && p.id !== product.id)
        .slice(0, 4);

      document.title = `SHOP — ${product.name}`;

      const discount = Math.round(((product.oldPrice - product.newPrice) / product.oldPrice) * 100);
      const tagHTML = product.tag
        ? `<span class="product-tag-detail ${product.tag === 'sale' ? 'tag-sale' : 'tag-new'}">${product.tag === 'sale' ? 'SALE' : 'NEW'}</span>`
        : "";
      const outHTML = product.stock === 0
        ? `<div class="out-of-stock-overlay">ДУУССАН</div>`
        : "";

      const desc = descriptions[product.category] || "Өндөр чанарын бараа. Танд сэтгэл ханамжтай худалдан авалт хийхийг хүсье.";
      const reviewCount = Math.floor(Math.random() * 200 + 50);

      // Build 4 fake thumbnails from the same image
      const thumbs = [product.image, product.image, product.image, product.image];
      const thumbHTML = thumbs.map((src, i) => `
        <div class="thumb ${i === 0 ? 'active' : ''}" onclick="selectThumb(this, '${src}')">
          <img src="${src}" alt="thumb ${i + 1}" onerror="this.style.background='#eee'">
        </div>
      `).join("");

      page.innerHTML = `
        <a href="javascript:history.back()" class="back-btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          Буцах
        </a>

        <!-- ── MAIN PRODUCT SECTION ── -->
        <div class="product-detail">
          <!-- IMAGE + THUMBNAILS -->
          <div class="product-images">
            <div class="main-image-wrap">
              <img id="mainImg" src="${product.image}" alt="${product.name}" onerror="this.style.background='#f0f0f0'">
              ${tagHTML}
              ${outHTML}
            </div>
            <div class="thumb-strip">${thumbHTML}</div>
          </div>

          <!-- INFO -->
          <div class="product-info">
            <a href="brand.html?brand=${encodeURIComponent(product.brand)}" class="product-brand-link">${product.brand}</a>
            <h1 class="product-title">${product.name}</h1>

            <div class="rating-row">
              <div class="stars">${renderStars(product.rating)}</div>
              <span class="rating-num">${product.rating}</span>
              <span class="rating-count">(${reviewCount} үнэлгээ)</span>
            </div>

            <div class="price-block">
              <span class="price-new">${formatPrice(product.newPrice)}</span>
              <span class="price-old">${formatPrice(product.oldPrice)}</span>
              <span class="price-discount">-${discount}%</span>
            </div>

            <div class="divider"></div>
            <p class="product-description">${desc}</p>
            <div class="divider"></div>

            <!-- Quantity -->
            <div>
              <p class="qty-label">Тоо ширхэг</p>
              <div class="qty-row">
                <div class="qty-control">
                  <button class="qty-btn" id="qtyMinus" onclick="changeQty(-1)">−</button>
                  <span class="qty-num" id="qtyNum">1</span>
                  <button class="qty-btn" id="qtyPlus" onclick="changeQty(1)">+</button>
                </div>
                <span class="qty-stock ${product.stock === 0 ? 'stock-out' : product.stock <= 10 ? 'stock-low' : 'stock-high'}">
                  ${product.stock === 0 ? '✗ Нөөц дууссан' : product.stock <= 10 ? '⚠ ' + product.stock + ' ширхэг үлдсэн' : '✓ ' + product.stock + ' ширхэг байна'}
                </span>
              </div>
            </div>

            <!-- Action buttons -->
            <div class="action-btns">
              <button class="btn-cart" id="cartBtn" ${product.stock === 0 ? 'disabled' : ''} onclick="addToCart()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/>
                </svg>
                ${product.stock > 0 ? 'Сагсанд нэмэх' : 'Нөөц дууссан'}
              </button>
              <button class="btn-wishlist" id="wishBtn" onclick="toggleWish()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/>
                </svg>
                Хадгалах
              </button>
            </div>

            <div class="divider"></div>

            <!-- Meta -->
            <div class="meta-list">
              <div class="meta-row">
                <span class="meta-key">Ангилал</span>
                <span class="meta-val">${catLabels[product.category] || product.category}</span>
              </div>
              <div class="meta-row">
                <span class="meta-key">Брэнд</span>
                <span class="meta-val">${product.brand}</span>
              </div>
              <div class="meta-row">
                <span class="meta-key">Үнэлгээ</span>
                <span class="meta-val">${product.rating} / 5.0</span>
              </div>
              <div class="meta-row">
                <span class="meta-key">Нөөц</span>
                <span class="meta-val" style="color:${product.stock === 0 ? '#b71c1c' : product.stock <= 10 ? '#a05000' : '#1a7a3a'};font-weight:600">${product.stock === 0 ? 'Дууссан' : product.stock + ' ширхэг'}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- ── DETAILED INFO + BRAND COMPARISON ── -->
        ${buildDetailSection(product)}

        <!-- ── REVIEWS ── -->
        ${buildReviews(product, sampleReviews)}

        <!-- ── RELATED PRODUCTS ── -->
        ${related.length ? `
        <div class="related-section">
          <h2>Төстэй бараанууд</h2>
          <div class="products" style="padding:0; grid-template-columns: repeat(4,1fr);">
            ${related.map(p => {
            const d = Math.round(((p.oldPrice - p.newPrice) / p.oldPrice) * 100);
            return `
                <article class="product" onclick="window.location='product.html?id=${p.id}'" style="cursor:pointer">
                  <figure>
                    <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">
                    ${p.tag ? `<span class="product-tag product-tag--${p.tag}">${p.tag === 'sale' ? 'SALE' : 'NEW'}</span>` : ''}
                  </figure>
                  <h3>${p.name}</h3>
                  <p class="price">
                    <span class="old">${formatPrice(p.oldPrice)}</span>
                    <span class="new">${formatPrice(p.newPrice)}</span>
                    <span class="discount-badge">-${d}%</span>
                  </p>
                </article>`;
          }).join('')}
          </div>
        </div>` : ''}
      `;

      /* ── Thumbnail switcher ── */
      window.selectThumb = function (el, src) {
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('mainImg').src = src;
      };

      /* ── Qty ── */
      let qty = 1;
      window.changeQty = function (delta) {
        qty = Math.max(1, qty + delta);
        document.getElementById("qtyNum").textContent = qty;
      };

      /* ── Cart ── */
      const me = getMe();
      const cartSvg = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/></svg>`;
      const wishSvgEmpty = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/></svg>`;
      const wishSvgFull = `<svg width="18" height="18" fill="red" stroke="red" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/></svg>`;

      if (me) {
        const cartBtn = document.getElementById("cartBtn");
        if (isInCart(product.id) && cartBtn) {
          cartBtn.classList.add("added");
          cartBtn.innerHTML = `${cartSvg} ✓ Сагсанд байна`;
        }
        const wishBtn = document.getElementById("wishBtn");
        if (isInSaved(product.id) && wishBtn) {
          wishBtn.classList.add("saved");
          wishBtn.innerHTML = `${wishSvgFull} Хадгалагдсан`;
        }
      }

      window.addToCart = function () {
        if (!me) { showToast("Нэвтэрч орно уу!"); setTimeout(() => window.location.href = "login.html", 1000); return; }
        storeAddToCart(product);
        const btn = document.getElementById("cartBtn");
        btn.classList.add("added");
        btn.innerHTML = `${cartSvg} ✓ Сагсанд байна`;
        showToast(`${product.name} сагсанд нэмэгдлээ!`);
      };

      window.toggleWish = function () {
        if (!me) { showToast("Нэвтэрч орно уу!"); setTimeout(() => window.location.href = "login.html", 1000); return; }
        const btn = document.getElementById("wishBtn");
        if (isInSaved(product.id)) {
          removeFromSaved(product.id);
          btn.classList.remove("saved");
          btn.innerHTML = `${wishSvgEmpty} Хадгалах`;
          showToast("Хадгалсанаас хасагдлаа.");
        } else {
          addToSaved(product);
          btn.classList.add("saved");
          btn.innerHTML = `${wishSvgFull} Хадгалагдсан`;
          showToast("Хадгалсан барааанд нэмэгдлээ!");
        }
      };

      /* ── Submit review ── */
      window.submitReview = function () {
        const name = document.getElementById("rvName").value.trim();
        const stars = parseInt(document.getElementById("rvStars").value);
        const body = document.getElementById("rvText").value.trim();
        if (!name || !body) { showToast("Нэр болон сэтгэгдлээ бөглөнө үү."); return; }

        const today = new Date().toISOString().slice(0, 10);
        const card = document.createElement("div");
        card.className = "review-card";
        card.innerHTML = `
          <div class="review-card-top">
            <div>
              <div class="reviewer-name">${name}</div>
              <div class="stars">${renderStars(stars, 14)}</div>
            </div>
            <div class="review-date">${today}</div>
          </div>
          <p class="review-body">${body}</p>
        `;
        document.getElementById("reviewList").appendChild(card);
        document.getElementById("rvName").value = "";
        document.getElementById("rvText").value = "";
        showToast("Сэтгэгдэл амжилттай нэмэгдлээ!");
      };
    }

    function renderNotFound() {
      page.innerHTML = `
        <div class="not-found">
          <h2>Бараа олдсонгүй</h2>
          <p>Уучлаарай, энэ бараа байхгүй эсвэл устгагдсан байна.</p>
          <a href="index.html">Дэлгүүр рүү буцах</a>
        </div>`;
    }


    init();
  </script>
</body>

</html>
