<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOP — Бараа</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .product-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 40px 100px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: hsl(0, 0%, 50%);
      text-decoration: none;
      margin-bottom: 36px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--color-text);
    }

    /* MAIN LAYOUT */
    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }

    /* IMAGE SIDE */
    .product-images {
      position: sticky;
      top: 100px;
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: var(--color-bg1);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }

    .main-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .main-image-wrap:hover img {
      transform: scale(1.04);
    }

    .product-tag-detail {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .tag-sale {
      background: red;
      color: white;
    }

    .tag-new {
      background: #222;
      color: white;
    }

    .out-of-stock-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: hsl(0, 0%, 40%);
      letter-spacing: 2px;
    }

    /* INFO SIDE */
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .product-brand-link {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: hsl(0, 0%, 50%);
      text-decoration: none;
      transition: color 0.2s;
    }

    .product-brand-link:hover {
      color: var(--color-text);
    }

    .product-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0;
    }

    /* RATING */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stars {
      display: flex;
      gap: 2px;
    }

    .star {
      font-size: 16px;
      color: hsl(0, 0%, 80%);
    }

    .star.filled {
      color: #f5a623;
    }

    .star.half {
      color: #f5a623;
      opacity: 0.5;
    }

    .rating-num {
      font-size: 14px;
      font-weight: 600;
    }

    .rating-count {
      font-size: 13px;
      color: hsl(0, 0%, 55%);
    }

    /* PRICE */
    .price-block {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .price-new {
      font-size: 32px;
      font-weight: 700;
      color: red;
    }

    .price-old {
      font-size: 18px;
      text-decoration: line-through;
      color: hsl(0, 0%, 60%);
    }

    .price-discount {
      background: hsl(0, 80%, 95%);
      color: red;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: var(--color-border);
    }

    /* DESCRIPTION */
    .product-description {
      font-size: 14px;
      line-height: 1.7;
      color: hsl(0, 0%, 40%);
    }

    /* QUANTITY */
    .qty-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: hsl(0, 0%, 50%);
      margin-bottom: 10px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid var(--color-border);
      border-radius: 30px;
      overflow: hidden;
    }

    .qty-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      color: var(--color-text);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: var(--color-bg1);
    }

    .qty-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .qty-num {
      font-size: 16px;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .qty-stock {
      font-size: 13px;
      color: hsl(140, 50%, 40%);
      font-weight: 500;
    }

    .qty-stock.out {
      color: hsl(0, 50%, 50%);
    }

    /* ACTION BUTTONS */
    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-cart {
      width: 100%;
      padding: 15px;
      background: var(--color-text);
      color: var(--color-white);
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-cart:hover {
      opacity: 0.82;
      transform: translateY(-1px);
    }

    .btn-cart:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-cart.added {
      background: hsl(140, 50%, 38%);
    }

    .btn-wishlist {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--color-text);
      border: 1.5px solid var(--color-border);
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-wishlist:hover {
      border-color: red;
      color: red;
    }

    .btn-wishlist.saved {
      border-color: red;
      color: red;
      background: hsl(0, 80%, 97%);
    }

    /* META INFO */
    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }

    .meta-key {
      color: hsl(0, 0%, 55%);
      min-width: 90px;
      flex-shrink: 0;
    }

    .meta-val {
      font-weight: 500;
      color: var(--color-text);
    }

    /* RELATED */
    .related-section {
      margin-top: 80px;
    }

    .related-section h2 {
      margin-bottom: 24px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--color-text);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* NOT FOUND */
    .not-found {
      text-align: center;
      padding: 120px 20px;
      color: hsl(0, 0%, 55%);
    }

    .not-found h2 {
      margin-bottom: 12px;
    }

    .not-found a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      border: 2px solid var(--color-text);
      border-radius: 30px;
      text-decoration: none;
      color: var(--color-text);
      font-size: 14px;
      transition: 0.2s;
    }

    .not-found a:hover {
      background: var(--color-text);
      color: white;
    }

    @media (max-width: 768px) {
      .product-page {
        padding: 20px 16px 100px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .product-images {
        position: static;
      }

      .product-title {
        font-size: 22px;
      }

      .price-new {
        font-size: 26px;
      }
    }
  </style>
</head>

  <script src="script.js"></script>
  <script type="module">
    import { getMe, addToCart as storeAddToCart, isInCart, addToSaved, removeFromSaved, isInSaved } from "./store.js";

    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get("id"));
    const page = document.getElementById("productPage");

    // Category label map
    const catLabels = {
      "huvtsas": "Хувцас, Гутал",
      "tsakhilgaan": "Цахилгаан бараа",
      "goo-saikhan": "Гоо сайхан",
      "ger-ahui": "Гэр ахуй",
      "ayalal": "Аялал",
      "eruul": "Эрүүл мэнд",
      "togloom": "Тоглоом",
      "bichig": "Бичиг хэрэг",
      "tejeewr": "Тэжээвэр амьтан",
      "shine-huns": "Шинэ хүнс",
      "bolovsruulsan-huns": "Боловсруулсан хүнс",
      "shingen-huns": "Шингэн хүнс",
    };

    // Simple descriptions per category
    const descriptions = {
      "huvtsas": "Өндөр чанарын материалаар хийгдсэн, таны хэв маягийг илэрхийлэх гоёмсог загвар. Урт эдэлгээтэй, тав тухтай.",
      "tsakhilgaan": "Хамгийн сүүлийн үеийн технологиор хийгдсэн бөгөөд таны өдөр тутмын амьдралыг хялбарчлах ухаалаг гаджет.",
      "goo-saikhan": "Мэргэжлийн гоо сайхны мэргэжилтнүүдэд хүртэл таалагддаг, арьс болон гоо сайханд зориулсан тусгай бүтээгдэхүүн.",
      "ger-ahui": "Таны гэрийг илүү затай, тухтай болгох өндөр чанарын гэр ахуйн бараа. Удаан эдэлгээтэй, практик загвар.",
      "ayalal": "Аялал жуулчлалын туршлагатай хүмүүсийн сонголт. Хөнгөн, бат бэх, авсаархан загвар.",
      "eruul": "Эрүүл мэнд, чийрэг байдлыг дэмжих мэргэжлийн бүтээгдэхүүн. Эмч нарын зөвлөмжид тулгуурлан бүтээгдсэн.",
      "togloom": "Бүх насны хүмүүст тохирох чанарлаг тоглоом болон хобби хэрэгсэл. Баяр баясгалан, суралцах боломжийг нэгтгэсэн.",
      "bichig": "Оффис болон сургуульд зориулсан өндөр чанарын бичиг хэрэгсэл. Бичих дуртай хүн бүрт тохиромжтой.",
      "tejeewr": "Таны үнэт тэжээвэр амьтдад зориулсан эрүүл, чанарлаг хоол болон хэрэгсэл.",
    };

    function formatPrice(n) {
      return n.toLocaleString("mn-MN") + "₮";
    }

    function renderStars(rating) {
      let html = "";
      for (let i = 1; i <= 5; i++) {
        if (rating >= i) html += `<span class="star filled">★</span>`;
        else if (rating >= i - 0.5) html += `<span class="star half">★</span>`;
        else html += `<span class="star">★</span>`;
      }
      return html;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    async function init() {
      if (!productId) {
        renderNotFound();
        return;
      }

      const res = await fetch("products.json");
      const data = await res.json();
      const product = data.products.find(p => p.id === productId);

      if (!product) {
        renderNotFound();
        return;
      }

      // Related: same category, different product
      const related = data.products
        .filter(p => p.category === product.category && p.id !== product.id)
        .slice(0, 4);

      document.title = `SHOP — ${product.name}`;

      const discount = Math.round(((product.oldPrice - product.newPrice) / product.oldPrice) * 100);
      const tagHTML = product.tag
        ? `<span class="product-tag-detail ${product.tag === 'sale' ? 'tag-sale' : 'tag-new'}">${product.tag === 'sale' ? 'SALE' : 'NEW'}</span>`
        : "";
      const outHTML = !product.inStock
        ? `<div class="out-of-stock-overlay">ДУУССАН</div>`
        : "";

      const desc = descriptions[product.category] || "Өндөр чанарын бараа. Танд сэтгэл ханамжтай худалдан авалт хийхийг хүсье.";

      page.innerHTML = `
        <a href="javascript:history.back()" class="back-btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          Буцах
        </a>

        <div class="product-detail">
          <!-- IMAGE -->
          <div class="product-images">
            <div class="main-image-wrap">
              <img src="${product.image}" alt="${product.name}" onerror="this.style.background='#f0f0f0'">
              ${tagHTML}
              ${outHTML}
            </div>
          </div>

          <!-- INFO -->
          <div class="product-info">
            <a href="brand.html?brand=${encodeURIComponent(product.brand)}" class="product-brand-link">${product.brand}</a>
            <h1 class="product-title">${product.name}</h1>

            <div class="rating-row">
              <div class="stars">${renderStars(product.rating)}</div>
              <span class="rating-num">${product.rating}</span>
              <span class="rating-count">(${Math.floor(Math.random() * 200 + 50)} үнэлгээ)</span>
            </div>

            <div class="price-block">
              <span class="price-new">${formatPrice(product.newPrice)}</span>
              <span class="price-old">${formatPrice(product.oldPrice)}</span>
              <span class="price-discount">-${discount}%</span>
            </div>

            <div class="divider"></div>

            <p class="product-description">${desc}</p>

            <div class="divider"></div>

            <!-- QUANTITY -->
            <div>
              <p class="qty-label">Тоо ширхэг</p>
              <div class="qty-row">
                <div class="qty-control">
                  <button class="qty-btn" id="qtyMinus" onclick="changeQty(-1)">−</button>
                  <span class="qty-num" id="qtyNum">1</span>
                  <button class="qty-btn" id="qtyPlus" onclick="changeQty(1)">+</button>
                </div>
                <span class="qty-stock ${!product.inStock ? 'out' : ''}">
                  ${product.inStock ? '✓ Нөөцтэй' : '✗ Нөөц дууссан'}
                </span>
              </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="action-btns">
              <button class="btn-cart" id="cartBtn" ${!product.inStock ? 'disabled' : ''} onclick="addToCart()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/>
                </svg>
                ${product.inStock ? 'Сагсанд нэмэх' : 'Нөөц дууссан'}
              </button>
              <button class="btn-wishlist" id="wishBtn" onclick="toggleWish()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/>
                </svg>
                Хадгалах
              </button>
            </div>

            <div class="divider"></div>

            <!-- META -->
            <div class="meta-list">
              <div class="meta-row">
                <span class="meta-key">Ангилал</span>
                <span class="meta-val">${catLabels[product.category] || product.category}</span>
              </div>
              <div class="meta-row">
                <span class="meta-key">Брэнд</span>
                <span class="meta-val">${product.brand}</span>
              </div>
              <div class="meta-row">
                <span class="meta-key">Үнэлгээ</span>
                <span class="meta-val">${product.rating} / 5.0</span>
              </div>
              <div class="meta-row">
                <span class="meta-key">Нөөц</span>
                <span class="meta-val">${product.inStock ? 'Байна' : 'Дууссан'}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- RELATED PRODUCTS -->
        ${related.length ? `
        <div class="related-section">
          <h2>Төстэй бараанууд</h2>
          <div class="products" style="padding:0; grid-template-columns: repeat(4,1fr);">
            ${related.map(p => {
        const d = Math.round(((p.oldPrice - p.newPrice) / p.oldPrice) * 100);
        return `
                <article class="product" onclick="window.location='product.html?id=${p.id}'" style="cursor:pointer">
                  <figure>
                    <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">
                    ${p.tag ? `<span class="product-tag product-tag--${p.tag}">${p.tag === 'sale' ? 'SALE' : 'NEW'}</span>` : ''}
                  </figure>
                  <h3>${p.name}</h3>
                  <p class="price">
                    <span class="old">${formatPrice(p.oldPrice)}</span>
                    <span class="new">${formatPrice(p.newPrice)}</span>
                    <span class="discount-badge">-${d}%</span>
                  </p>
                </article>`;
      }).join('')}
          </div>
        </div>` : ''}
      `;

      // Qty logic
      let qty = 1;
      window.changeQty = function (delta) {
        qty = Math.max(1, qty + delta);
        document.getElementById("qtyNum").textContent = qty;
      };

      // Cart — syncs to localStorage via store.js
      const me = getMe();
      const cartSvg = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/></svg>`;
      const wishSvgEmpty = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/></svg>`;
      const wishSvgFull = `<svg width="18" height="18" fill="red" stroke="red" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/></svg>`;

      // Sync initial button states if logged in
      if (me) {
        const cartBtn = document.getElementById("cartBtn");
        if (isInCart(product.id) && cartBtn) {
          cartBtn.classList.add("added");
          cartBtn.innerHTML = `${cartSvg} ✓ Сагсанд байна`;
        }
        const wishBtn = document.getElementById("wishBtn");
        if (isInSaved(product.id) && wishBtn) {
          wishBtn.classList.add("saved");
          wishBtn.innerHTML = `${wishSvgFull} Хадгалагдсан`;
        }
      }

      window.addToCart = function () {
        if (!me) { showToast("Нэвтэрч орно уу!"); setTimeout(() => window.location.href = "login.html", 1000); return; }
        storeAddToCart(product);
        const btn = document.getElementById("cartBtn");
        btn.classList.add("added");
        btn.innerHTML = `${cartSvg} ✓ Сагсанд байна`;
        showToast(`${product.name} сагсанд нэмэгдлээ!`);
      };

      // Wishlist — syncs to localStorage via store.js
      window.toggleWish = function () {
        if (!me) { showToast("Нэвтэрч орно уу!"); setTimeout(() => window.location.href = "login.html", 1000); return; }
        const btn = document.getElementById("wishBtn");
        if (isInSaved(product.id)) {
          removeFromSaved(product.id);
          btn.classList.remove("saved");
          btn.innerHTML = `${wishSvgEmpty} Хадгалах`;
          showToast("Хадгалсанаас хасагдлаа.");
        } else {
          addToSaved(product);
          btn.classList.add("saved");
          btn.innerHTML = `${wishSvgFull} Хадгалагдсан`;
          showToast("Хадгалсан барааанд нэмэгдлээ!");
        }
      };
    }

    function renderNotFound() {
      page.innerHTML = `
        <div class="not-found">
          <h2>Бараа олдсонгүй</h2>
          <p>Уучлаарай, энэ бараа байхгүй эсвэл устгагдсан байна.</p>
          <a href="index.html">Дэлгүүр рүү буцах</a>
        </div>`;
    }

    init();
  </script>
</body>

</html>
