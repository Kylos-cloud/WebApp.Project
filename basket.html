<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP — Сагс</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 80px 80px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            gap: 16px;
            background: var(--color-white);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-card);
            animation: fadeSlideUp 0.3s ease forwards;
        }

        .cart-item-img {
            width: 100px;
            height: 110px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: var(--color-bg1);
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cart-item-name {
            font-size: 15px;
            font-weight: 600;
        }

        .cart-item-meta {
            font-size: 13px;
            color: hsl(0, 0%, 50%);
            margin-top: 4px;
        }

        .cart-item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--color-border);
            border-radius: 30px;
            padding: 4px 12px;
        }

        .qty-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--color-text);
            line-height: 1;
            padding: 0 2px;
        }

        .qty-btn:hover {
            opacity: 0.5;
        }

        .qty-num {
            font-size: 15px;
            font-weight: 600;
            min-width: 16px;
            text-align: center;
        }

        .cart-item-price {
            font-size: 15px;
            font-weight: 700;
            color: red;
        }

        .cart-item-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: hsl(0, 0%, 60%);
            font-size: 18px;
            padding: 0;
            transition: color 0.2s;
        }

        .cart-item-remove:hover {
            color: var(--color-text);
        }

        .cart-empty {
            text-align: center;
            padding: 80px 20px;
            color: hsl(0, 0%, 55%);
            display: none;
            width: 100%;
        }

        .cart-empty svg {
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .cart-empty p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .cart-empty a {
            display: inline-block;
            padding: 12px 28px;
            border: 2px solid var(--color-text);
            border-radius: 30px;
            text-decoration: none;
            color: var(--color-text);
            font-size: 14px;
            transition: 0.2s;
        }

        .cart-empty a:hover {
            background: var(--color-text);
            color: var(--color-white);
        }

        .cart-summary {
            background: var(--color-white);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-card);
            position: sticky;
            top: 80px;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 12px;
            color: hsl(0, 0%, 40%);
        }

        .summary-row.total {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text);
            border-top: 1px solid var(--color-border);
            padding-top: 14px;
            margin-top: 4px;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-text);
            color: var(--color-white);
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .checkout-btn:hover {
            opacity: 0.8;
        }

        .checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .page-content {
                padding: 20px 16px 100px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }
        }
    </style>
</head>

<body>

            </ul>
        </nav>
    </header>

    <main class="page-content">
        <h2 class="page-title">Миний сагс</h2>

        <div class="cart-empty" id="cartEmpty">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312" />
            </svg>
            <p>Таны сагс хоосон байна</p>
            <a href="index.html">Дэлгүүр үзэх</a>
        </div>

        <div class="cart-layout" id="cartLayout" style="display:none">
            <div class="cart-items" id="cartItems"></div>
            <aside class="cart-summary" id="cartSummary">
                <h3 class="summary-title">Захиалгын дүн</h3>
                <div class="summary-row"><span>Бараа</span><span id="subtotal">0₮</span></div>
                <div class="summary-row"><span>Хүргэлт</span><span>5,000₮</span></div>
                <div class="summary-row total"><span>Нийт дүн</span><span id="total">5,000₮</span></div>
                <button class="checkout-btn" id="checkoutBtn" onclick="handleCheckout()">Захиалга үргэлжлүүлэх
                    →</button>
            </aside>
        </div>
    </main>

            </svg><span>Нүүр</span></a>

            </svg><span>Ангилал</span></a>

                    d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />

    <script src="js/categoryMenu.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/searchAll.js"></script>
    <script type="module" src="js/badges.js"></script>
    <script type="module">
        import { getMe, getCart, removeFromCart, updateCartQty, formatPrice, formatVariant, variantKey } from "./js/store.js";

        // Row is identified by (productId, variantAttrs). We use the same key
        // we send into the cart so this stays consistent if more attrs appear.
        function rowKey(id, attrs) { return `${id}__${variantKey(attrs)}`; }

        // Indexed lookup so onclick handlers don't need to encode arbitrary attrs into HTML.
        // MUST be declared before renderCart() is invoked — renderCart reassigns it,
        // and a `let` in temporal-dead-zone would throw mid-render and leave the
        // page stuck with the summary visible but no items (exactly the bug we hit).
        let rowIndex = new Map();

        // Auth guard
        const me = getMe();
        if (!me) {
            document.body.innerHTML = `
        <style>body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5}.gate-box{background:#fff;border-radius:16px;padding:48px 40px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.10);max-width:380px;width:90%}.gate-box h2{font-size:22px;margin-bottom:8px}.gate-box p{color:#777;font-size:14px;margin-bottom:28px}.gate-btn{display:inline-block;padding:12px 32px;background:#222;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;font-size:14px;margin:6px;transition:opacity .2s}.gate-btn:hover{opacity:.8}.gate-btn.outline{background:transparent;border:2px solid #222;color:#222}</style>
        <div class="gate-box">
          <svg width="48" height="48" fill="none" stroke="#222" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"/></svg>
          <h2>Нэвтрэх шаардлагатай</h2>
          <p>Сагсаа харахын тулд эхлээд нэвтэрнэ үү.</p>
          <a href="login.html" class="gate-btn">Нэвтрэх / Бүртгүүлэх</a>
          <a href="index.html" class="gate-btn outline">Дэлгүүр үзэх</a>
        </div>`;
        } else {
            renderCart();
        }

        function renderCart() {
            // Drop any rows missing the basics we need to render — these can creep
            // in from older cart shapes (pre-variant) or interrupted writes. Without
            // this filter the row would render as a sliver of empty HTML and the
            // page ends up looking blank with only the summary sidebar visible.
            const cart = getCart().filter(p =>
                p && typeof p.id === "number" && typeof p.newPrice === "number" && p.name
            );
            const itemsEl = document.getElementById("cartItems");
            const emptyEl = document.getElementById("cartEmpty");
            const layoutEl = document.getElementById("cartLayout");

            if (!cart.length) {
                layoutEl.style.display = "none";
                emptyEl.style.display = "block";
                return;
            }

            emptyEl.style.display = "none";
            layoutEl.style.display = "grid";

            rowIndex = new Map();
            itemsEl.innerHTML = cart.map(p => {
                const key = rowKey(p.id, p.variantAttrs);
                rowIndex.set(key, { id: p.id, attrs: p.variantAttrs || null, newPrice: p.newPrice });
                const variantStr = formatVariant(p.variantAttrs);
                const variantLabel = variantStr ? ` · ${variantStr}` : '';
                // Buttons use data-action / data-key so the parent listener can
                // pick up the click reliably. Inline onclick="removeItem(...)"
                // breaks if the module errors before window.removeItem is set,
                // which is exactly the kind of silent failure we just hit.
                return `
        <article class="cart-item" data-key="${key}">
          <img class="cart-item-img" src="${p.image}" alt="${p.name}" onerror="this.style.background='#f0f0f0'">
          <div class="cart-item-info">
            <div>
              <p class="cart-item-name">${p.name}</p>
              <p class="cart-item-meta">${p.brand || ''}${variantLabel}</p>
            </div>
            <div class="cart-item-bottom">
              <div class="qty-control">
                <button class="qty-btn" data-action="dec" data-key="${key}" type="button">−</button>
                <span class="qty-num" id="qty-${key}">${p.qty || 1}</span>
                <button class="qty-btn" data-action="inc" data-key="${key}" type="button">+</button>
              </div>
              <span class="cart-item-price">${formatPrice(p.newPrice * (p.qty || 1))}</span>
              <button class="cart-item-remove" data-action="remove" data-key="${key}" type="button" aria-label="Устгах">✕</button>
            </div>
          </div>
        </article>`;
            }).join("");

            updateTotals();
        }

        // Single delegated listener for all cart-item buttons. Survives re-render
        // and avoids the inline-onclick / window-binding fragility entirely.
        document.getElementById("cartItems").addEventListener("click", e => {
            const btn = e.target.closest("[data-action]");
            if (!btn) return;
            const key = btn.dataset.key;
            const action = btn.dataset.action;
            if (action === "remove") removeItem(key);
            else if (action === "inc") changeQty(key, +1);
            else if (action === "dec") changeQty(key, -1);
        });

        function getValidCart() {
            return getCart().filter(p =>
                p && typeof p.id === "number" && typeof p.newPrice === "number" && p.name
            );
        }

        function updateTotals() {
            const subtotal = getValidCart().reduce((s, p) => s + p.newPrice * (p.qty || 1), 0);
            document.getElementById("subtotal").textContent = formatPrice(subtotal);
            document.getElementById("total").textContent = formatPrice(subtotal + 5000);
        }

        function changeQty(key, delta) {
            const row = rowIndex.get(key);
            if (!row) return;
            const cart = getCart();
            const item = cart.find(p => p.id === row.id && rowKey(p.id, p.variantAttrs) === key);
            if (!item) return;
            const newQty = Math.max(1, (item.qty || 1) + delta);
            updateCartQty(row.id, newQty, row.attrs);
            const qtyEl = document.getElementById(`qty-${key}`);
            if (qtyEl) qtyEl.textContent = newQty;
            const article = document.querySelector(`.cart-item[data-key="${key}"]`);
            if (article) article.querySelector(".cart-item-price").textContent = formatPrice(item.newPrice * newQty);
            updateTotals();
        }

        function removeItem(key) {
            const row = rowIndex.get(key);
            if (!row) return;
            const article = document.querySelector(`.cart-item[data-key="${key}"]`);
            if (article) {
                article.style.transition = "opacity 0.3s ease, transform 0.3s ease";
                article.style.opacity = "0";
                article.style.transform = "translateX(20px)";
                setTimeout(() => {
                    removeFromCart(row.id, row.attrs);
                    renderCart();
                }, 300);
            } else {
                // Element missing (already animated away, etc) — just commit the data change.
                removeFromCart(row.id, row.attrs);
                renderCart();
            }
        }

        window.handleCheckout = function () {
            const cart = getCart();
            if (!cart.length) {
                alert("Сагс хоосон байна. Бараа нэмнэ үү.");
                return;
            }
            if (!getMe()) {
                window.location.href = "login.html";
                return;
            }
            window.location.href = "checkout.html";
        };
    </script>
