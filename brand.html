  <script type="module">
    import { ProductStore } from "./modules/ProductStore.js";
    import { ProductRenderer } from "./modules/ProductRenderer.js";
    import { API_BASE } from "./js/store.js";

    async function init() {
      // URL-аас брэндийн нэр авах
      const params = new URLSearchParams(window.location.search);
      const brandName = params.get("brand") || "";

      if (!brandName) {
        window.location.href = "index.html";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/products/all`);
        if (!res.ok) throw new Error("Server алдаа: " + res.status);
        const data = await res.json();
        const store = new ProductStore(data);

        // Брэндийн мэдээлэл олох (case-insensitive)
        const brandInfo = data.brands.find(
          b => b.name.toLowerCase() === brandName.toLowerCase()
        );

        // Hero хэсэг
        document.title = `SHOP — ${brandName}`;
        const matchedProducts = store.allProducts.filter(
          p => (p.brand || "").toLowerCase() === brandName.toLowerCase()
        );

        document.getElementById("brandHero").innerHTML = `
          ${brandInfo
            ? `<img class="brand-hero-logo" src="${brandInfo.image}" alt="${brandName}"
                    onerror="this.style.display='none'">`
            : ""}
          <div class="brand-hero-info">
            <h1>${brandName.toUpperCase()}</h1>
            <p>${matchedProducts.length} бараа</p>
          </div>`;

        document.getElementById("brandProductTitle").textContent =
          `${brandName} — бүх бараа`;

        const renderer = new ProductRenderer({
          productsEl: document.getElementById("brandProductsGrid")
        });

        if (matchedProducts.length === 0) {
          document.getElementById("brandProductsGrid").innerHTML =
            `<p class="empty-msg">${brandName} брэндийн бараа олдсонгүй.</p>`;
        } else {
          renderer.renderProducts(matchedProducts);
        }
      } catch (err) {
        console.error("Brand хуудас ачаалахад алдаа гарлаа:", err);
        document.getElementById("brandProductsGrid").innerHTML =
          `<p class="empty-msg">Сервертэй холбогдоход алдаа гарлаа. Дахин оролдоно уу.</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
