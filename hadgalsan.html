<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP — Хадгалсан</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 80px 80px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .saved-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .saved-card {
            position: relative;
            transition: transform 0.3s ease;
            animation: fadeSlideUp 0.5s ease forwards;
        }

        .saved-card:hover {
            transform: translateY(-5px) scale(1.03);
        }

        .saved-card figure {
            width: 100%;
            height: 260px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 3px;
        }

        .saved-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .saved-card h3 {
            font-size: 14px;
            margin-top: 10px;
            font-weight: 600;
        }

        .price {
            margin-top: 6px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .unsave-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--color-white);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease;
        }

        .unsave-btn:hover {
            transform: scale(1.15);
        }

        .unsave-btn svg {
            fill: red;
            stroke: red;
        }

        .add-cart-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: var(--color-text);
            color: var(--color-white);
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .add-cart-btn:hover {
            opacity: 0.75;
        }

        .add-cart-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .saved-empty {
            text-align: center;
            padding: 100px 20px;
            color: hsl(0, 0%, 55%);
            display: none;
        }

        .saved-empty svg {
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .saved-empty p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .saved-empty a {
            display: inline-block;
            padding: 12px 28px;
            border: 2px solid var(--color-text);
            border-radius: 30px;
            text-decoration: none;
            color: var(--color-text);
            font-size: 14px;
            transition: 0.2s;
        }

        .saved-empty a:hover {
            background: var(--color-text);
            color: var(--color-white);
        }

        @media (max-width: 1024px) {
            .saved-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-content {
                padding: 40px;
            }
        }

        @media (max-width: 768px) {
            .page-content {
                padding: 20px 16px 100px;
            }

            .saved-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .saved-card figure {
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="top-bar">
            <h1 class="logo"><a href="index.html">SHOP</a></h1>
            <search class="search"><input type="text" placeholder="Бараа хайх..."></search>
            <nav class="icons">

                        fill="none" viewBox="0 0 24 24">

                    </svg></a>
                <a href="hadgalsan.html" class="icon-heart"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                        height="24" fill="none" viewBox="0 0 24 24">

                            d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z" />
                    </svg></a>
                <a href="#" class="icon-search-toggle" id="searchToggle"><svg xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                            d="m21 21-3.5-3.5M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0Z" />
                    </svg></a>
                <a href="basket.html" class="icon-cart"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312" />
                    </svg></a>
            </nav>
        </div>
        <nav class="menu">
            <ul>
                <li>☰ БҮХ АНГИЛАЛ</li>
                <li><a href="index.html#brand">BRANDS</a></li>
                <li><a href="index.html#sales">SALES</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <h2 class="page-title">Хадгалсан бараанууд</h2>
        <div class="saved-grid" id="savedGrid"></div>
        <div class="saved-empty" id="savedEmpty">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z" />
            </svg>

    </main>

        <a href="index.html#sales" class="bottom-nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22"
                height="22" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 0 0-2 2v3a2 2 0 0 1 0 4v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a2 2 0 0 1 0-4V7a2 2 0 0 0-2-2H5Z" />
            </svg><span>Онцлох</span></a>
        <a href="hadgalsan.html" class="bottom-nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="22"

                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z" />
            </svg><span>Хадгалсан</span></a>
        <a href="login.html" class="bottom-nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                fill="none" viewBox="0 0 24 24">

                    d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg><span>Профайл</span></a>
    </nav>

    <script src="script.js"></script>
    <script type="module">
        import { getMe, getSaved, removeFromSaved, addToCart, isInCart, formatPrice } from "./store.js";

        const me = getMe();
        if (!me) {
            document.body.innerHTML = `
        <style>body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5}.gate-box{background:#fff;border-radius:16px;padding:48px 40px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.10);max-width:380px;width:90%}.gate-box h2{font-size:22px;margin-bottom:8px}.gate-box p{color:#777;font-size:14px;margin-bottom:28px}.gate-btn{display:inline-block;padding:12px 32px;background:#222;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;font-size:14px;margin:6px;transition:opacity .2s}.gate-btn:hover{opacity:.8}.gate-btn.outline{background:transparent;border:2px solid #222;color:#222}</style>
        <div class="gate-box">
          <svg width="48" height="48" fill="none" stroke="#222" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/></svg>
          <h2>Нэвтрэх шаардлагатай</h2>
          <p>Хадгалсан барааг харахын тулд эхлээд нэвтэрнэ үү.</p>
          <a href="login.html" class="gate-btn">Нэвтрэх / Бүртгүүлэх</a>
          <a href="index.html" class="gate-btn outline">Дэлгүүр үзэх</a>
        </div>`;
        } else {
            renderSaved();
        }

        function renderSaved() {
            const saved = getSaved();
            const grid = document.getElementById("savedGrid");
            const empty = document.getElementById("savedEmpty");

            if (!saved.length) {
                grid.style.display = "none";
                empty.style.display = "block";
                return;
            }

            grid.style.display = "grid";
            empty.style.display = "none";

            grid.innerHTML = saved.map(p => {
                const inCart = isInCart(p.id);
                const discount = Math.round(((p.oldPrice - p.newPrice) / p.oldPrice) * 100);
                return `
        <article class="saved-card" data-id="${p.id}">
          <button class="unsave-btn" onclick="unsave(${p.id})" title="Хадгалсанаас хасах">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"><path stroke="red" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/></svg>
          </button>
          <a href="product.html?id=${p.id}" style="text-decoration:none;color:inherit;display:block">
            <figure><img src="${p.image}" alt="${p.name}" onerror="this.style.background='#eee'"></figure>
            <h3>${p.name}</h3>
            <p class="price">
              <span class="old">${formatPrice(p.oldPrice)}</span>
              <span class="new">${formatPrice(p.newPrice)}</span>
              <span class="discount-badge">-${discount}%</span>
            </p>
          </a>
          <button class="add-cart-btn" id="cart-btn-${p.id}" onclick="moveToCart(${p.id})" ${inCart ? 'disabled' : ''}>
            ${inCart ? '✓ Сагсанд байна' : 'Сагсанд нэмэх'}
          </button>
        </article>`;
            }).join("");
        }

        window.unsave = function (id) {
            const card = document.querySelector(`.saved-card[data-id="${id}"]`);
            if (card) {
                card.style.transition = "opacity 0.3s ease, transform 0.3s ease";
                card.style.opacity = "0";
                card.style.transform = "scale(0.9)";
                setTimeout(() => {
                    removeFromSaved(id);
                    renderSaved();
                }, 300);
            }
        };

        window.moveToCart = function (id) {
            const saved = getSaved();
            const product = saved.find(p => p.id === id);
            if (!product) return;
            addToCart(product);
            const btn = document.getElementById(`cart-btn-${id}`);
            if (btn) { btn.textContent = "✓ Сагсанд байна"; btn.disabled = true; }
        };
    </script>
</body>
